<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Royalty Runner – Calendar</title>

  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/favicon.ico" />

  <style>
    body {
      background: #000;
      color: var(--copper-light);
      font-family: sans-serif;
    }

    .calendar-container {
      max-width: 900px;
      margin: 2rem auto;
      padding: 1rem;
    }

    #calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    #calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.5rem;
    }

    #calendar-weekday-labels {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      margin-bottom: 0.5rem;
      font-weight: bold;
      color: var(--copper);
    }

    .calendar-cell {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--copper);
      border-radius: 6px;
      padding: 0.5rem;
      cursor: pointer;
    }

    .calendar-cell.today {
      border-color: var(--copper-light);
      background: rgba(184,115,51,0.25);
    }

    .calendar-events {
      margin-top: 0.25rem;
      font-size: 0.8rem;
    }

    .calendar-event-pill {
      background: var(--copper);
      color: #000;
      padding: 2px 6px;
      border-radius: 999px;
      margin-bottom: 2px;
      display: inline-block;
      font-size: 0.75rem;
    }

    #agenda-list {
      margin-top: 2rem;
      padding: 1rem;
      border: 1px solid var(--copper);
      border-radius: 8px;
      background: rgba(255,255,255,0.05);
    }

    /* Modal */
    #event-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    #event-modal-content {
      background: #111;
      padding: 1.5rem;
      border: 1px solid var(--copper);
      border-radius: 10px;
      width: 90%;
      max-width: 400px;
    }

    #event-modal-content input,
    #event-modal-content select,
    #event-modal-content textarea {
      width: 100%;
      margin-bottom: 0.75rem;
      padding: 0.5rem;
      background: #000;
      border: 1px solid var(--copper);
      color: var(--copper-light);
      border-radius: 6px;
    }

    #event-modal-content button {
      padding: 0.5rem 1rem;
      margin-right: 0.5rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }

    #event-save { background: var(--copper); color: #000; }
    #event-delete { background: #900; color: #fff; }
    #event-cancel { background: #333; color: #fff; }
  </style>
</head>

<body>
<div class="calendar-container">

  <div id="calendar-header">
    <button id="cal-prev">&lt;</button>
    <h2 id="calendar-current-label"></h2>
    <button id="cal-next">&gt;</button>
  </div>

  <div style="text-align:center; margin-bottom:1rem;">
    <button id="cal-today">Today</button>
    <button id="cal-view-month">Month</button>
    <button id="cal-view-week">Week</button>
    <button id="cal-new-event">New Event</button>
  </div>

  <div id="calendar-weekday-labels"></div>
  <div id="calendar-grid"></div>

  <h3 style="margin-top:2rem; color:var(--copper);">Upcoming Agenda</h3>
  <div id="agenda-list"></div>

</div>

<!-- EVENT MODAL -->
<div id="event-modal">
  <div id="event-modal-content">
    <h3 style="color:var(--copper); margin-bottom:1rem;">Event Details</h3>

    <input id="event-title" placeholder="Title" />
    <input id="event-date" type="date" />
    <input id="event-start" type="time" />
    <input id="event-end" type="time" />

    <select id="event-type">
      <option value="general">General</option>
      <option value="show">Show</option>
      <option value="release">Release</option>
      <option value="task">Task</option>
    </select>

    <textarea id="event-notes" rows="3" placeholder="Notes..."></textarea>

    <label style="display:flex;align-items:center;gap:0.5rem;">
      <input type="checkbox" id="event-reminder" />
      Reminder
    </label>

    <div style="margin-top:1rem;">
      <button id="event-save">Save</button>
      <button id="event-delete">Delete</button>
      <button id="event-cancel">Cancel</button>
    </div>
  </div>
</div>

<script src="assets/js/calendar.js"></script>
</body>
</html>
