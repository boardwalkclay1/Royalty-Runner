<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Royalty Runner – Calendar</title>

  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/favicon.ico" />

  <style>
    :root{
      --copper: #b87333;
      --copper-light: #f0c0a0;
      --bg: #000;
      --muted: #e6e6e6;
    }

    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--muted);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .calendar-container {
      max-width: 980px;
      margin: 2rem auto;
      padding: 1rem;
      box-sizing: border-box;
    }

    #calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    #calendar-controls {
      display:flex;
      gap:0.5rem;
      align-items:center;
    }

    button {
      background: transparent;
      color: var(--muted);
      border: 1px solid rgba(255,255,255,0.06);
      padding: 0.45rem 0.6rem;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.08); }

    #calendar-weekday-labels {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      margin-bottom: 0.5rem;
      font-weight: 700;
      color: var(--copper);
    }

    #calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.5rem;
    }

    .calendar-cell {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(184,115,51,0.08);
      border-radius: 8px;
      padding: 0.6rem;
      cursor: pointer;
      min-height: 72px;
      box-sizing: border-box;
      display:flex;
      flex-direction:column;
      justify-content:flex-start;
    }

    .calendar-cell.empty-cell {
      background: transparent;
      border: 0;
      cursor: default;
      min-height: 48px;
    }

    .calendar-cell.today {
      border-color: var(--copper-light);
      background: rgba(184,115,51,0.10);
      box-shadow: 0 6px 18px rgba(184,115,51,0.04) inset;
    }

    .calendar-cell-header { display:flex; justify-content:flex-end; }
    .date-number {
      font-weight:700;
      color:var(--muted);
      background: rgba(255,255,255,0.02);
      padding: 2px 6px;
      border-radius:6px;
      font-size:0.95rem;
    }

    .calendar-events {
      margin-top: 0.5rem;
      font-size: 0.78rem;
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    .calendar-event-pill {
      background: var(--copper);
      color: #000;
      padding: 4px 8px;
      border-radius: 999px;
      display: inline-block;
      font-size: 0.78rem;
      max-width:100%;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    #agenda-list {
      margin-top: 1.5rem;
      padding: 1rem;
      border: 1px solid rgba(184,115,51,0.08);
      border-radius: 8px;
      background: rgba(255,255,255,0.01);
    }

    .agenda-item {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:1rem;
      padding:0.5rem 0;
      border-bottom:1px dashed rgba(255,255,255,0.02);
    }
    .agenda-item:last-child { border-bottom:0; }
    .agenda-title { font-weight:700; color:var(--muted); }
    .agenda-meta { font-size:0.85rem; color:rgba(255,255,255,0.6); }

    /* Modal */
    #event-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    #event-modal[aria-hidden="false"] { display:flex; }

    #event-modal-content {
      background: #0f0f0f;
      padding: 1.25rem;
      border: 1px solid rgba(184,115,51,0.08);
      border-radius: 10px;
      width: 92%;
      max-width: 520px;
      box-sizing: border-box;
    }

    #event-modal-content input,
    #event-modal-content select,
    #event-modal-content textarea {
      width: 100%;
      margin-bottom: 0.6rem;
      padding: 0.5rem;
      background: #070707;
      border: 1px solid rgba(184,115,51,0.06);
      color: var(--copper-light);
      border-radius: 6px;
      box-sizing: border-box;
    }

    #event-modal-content button {
      padding: 0.5rem 0.9rem;
      margin-right: 0.5rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }

    #event-save { background: var(--copper); color: #000; }
    #event-delete { background: #900; color: #fff; }
    #event-cancel { background: #333; color: #fff; }

    @media (max-width:720px) {
      .calendar-container { padding: 0.75rem; margin: 1rem; }
      .calendar-cell { min-height: 56px; }
      #calendar-weekday-labels { font-size: 0.85rem; }
    }
  </style>
</head>

<body>
  <div class="calendar-container">

    <div id="calendar-header">
      <div id="calendar-controls">
        <button id="cal-prev" aria-label="Previous month/week">&lt;</button>
        <button id="cal-next" aria-label="Next month/week">&gt;</button>
      </div>

      <h2 id="calendar-current-label" aria-live="polite"></h2>

      <div id="calendar-actions">
        <button id="cal-today">Today</button>
        <button id="cal-view-month">Month</button>
        <button id="cal-view-week">Week</button>
        <button id="cal-new-event">New Event</button>
      </div>
    </div>

    <div id="calendar-weekday-labels" role="row" aria-hidden="false"></div>
    <div id="calendar-grid" role="grid" aria-label="Calendar grid"></div>

    <h3 style="margin-top:1.5rem; color:var(--copper);">Upcoming Agenda</h3>
    <div id="agenda-list" aria-live="polite"></div>

  </div>

  <!-- EVENT MODAL -->
  <div id="event-modal" aria-hidden="true" role="dialog" aria-modal="true">
    <div id="event-modal-content">
      <h3 style="color:var(--copper); margin-bottom:0.75rem;">Event Details</h3>

      <input id="event-title" placeholder="Title" aria-label="Event title" />
      <input id="event-date" type="date" aria-label="Event date" />
      <input id="event-start" type="time" aria-label="Start time" />
      <input id="event-end" type="time" aria-label="End time" />

      <select id="event-type" aria-label="Event type">
        <option value="general">General</option>
        <option value="show">Show</option>
        <option value="release">Release</option>
        <option value="task">Task</option>
      </select>

      <textarea id="event-notes" rows="3" placeholder="Notes..." aria-label="Notes"></textarea>

      <label style="display:flex;align-items:center;gap:0.5rem;">
        <input type="checkbox" id="event-reminder" aria-label="Reminder" />
        Reminder
      </label>

      <div style="margin-top:1rem;">
        <button id="event-save">Save</button>
        <button id="event-delete">Delete</button>
        <button id="event-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <script src="assets/js/calendar.js"></script>
</body>
</html>
