<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Royalty Runner – Works Studio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="assets/css/style.css" />

  <style>
    body {
      background: url("assets/img/royal-randr.jpg") center/cover fixed;
      background-color: #000;
    }
    .overlay { background: rgba(0,0,0,0.82); min-height: 100vh; padding-bottom: 4rem; }
    .section-card {
      background: rgba(0,0,0,0.7);
      border: 1px solid var(--copper);
      border-radius: 10px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }
    .floating-catalog {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      background: var(--copper);
      color: #000;
      padding: 0.8rem 1.2rem;
      border-radius: 999px;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 0 0 10px rgba(184,115,51,0.7);
      z-index: 9999;
    }
  </style>
</head>

<body>
<div class="overlay">

  <header>
    <h1 class="cursive">Works Studio</h1>
    <p class="tagline">Your ideas, captured instantly.</p>
  </header>

  <main>

    <!-- 🎤 Voice Recorder injected here -->
    <section id="voice-module" class="section-card"></section>

    <!-- 📝 Journal injected here -->
    <section id="journal-module" class="section-card"></section>

    <!-- 🎥 Video Recorder -->
    <section class="section-card">
      <h2 class="cursive" style="font-size:1.8rem;">Video Recorder</h2>
      <a href="works-video.html" style="color:var(--copper); text-decoration:underline;">Open Video Recorder</a>
    </section>

  </main>
</div>

<a href="my-catalog.html" class="floating-catalog">My Catalog</a>

<!-- Injected JS modules -->
<script src="assets/js/works-shared.js"></script>
<script src="assets/js/works-voice.js"></script>
<script src="assets/js/works-journal.js"></script>

</body>
</html>
