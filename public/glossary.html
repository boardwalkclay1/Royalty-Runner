<!DOCTYPE html>
<html lang="en" data-page="glossary">
<head>
  <meta charset="UTF-8" />
  <title>Royalty Runner – Glossary</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600&display=swap" rel="stylesheet">

  <style>
    body {
      background: url("assets/img/royal-catalog.jpg") no-repeat center center fixed;
      background-size: cover;
      background-color: #000;
    }
    .overlay {
      background: rgba(0,0,0,0.78);
      min-height: 100vh;
      padding-bottom: 4rem;
    }
    .section-card {
      background: rgba(0,0,0,0.65);
      border: 1px solid var(--copper);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      backdrop-filter: blur(4px);
    }
    #glossary-search {
      width: 100%;
      padding: 0.7rem;
      border-radius: 8px;
      border: 1px solid var(--copper);
      background: rgba(0,0,0,0.4);
      color: #fff;
      margin-bottom: 1rem;
    }
    .dropdown {
      margin-bottom: 1rem;
    }
    .dropdown-header {
      cursor: pointer;
      font-family: 'Dancing Script', cursive;
      font-size: 1.6rem;
      color: var(--copper);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .dropdown-content {
      display: none;
      padding-left: 1rem;
      border-left: 2px solid var(--copper);
      margin-bottom: 0.5rem;
      color: #ddd;
      font-size: 0.95rem;
    }
    .tag-row {
      margin-top: 0.4rem;
      font-size: 0.8rem;
      color: #bbb;
    }
    .tag {
      display: inline-block;
      padding: 0.1rem 0.5rem;
      border-radius: 999px;
      border: 1px solid var(--copper);
      margin-right: 0.3rem;
      margin-top: 0.2rem;
    }
  </style>
</head>

<body>
<div class="overlay">

  <header class="rr-header">
    <h1 class="cursive" style="font-size:3rem;">Royalty Runner Glossary</h1>
    <button id="rr-menu-btn" class="rr-menu-btn">☰</button>
  </header>

  <main class="rr-main">

    <section class="section-card">
      <h2 class="cursive" style="font-size:2rem;">Search the Glossary</h2>
      <input type="search" id="glossary-search" placeholder="Search terms...">
    </section>

    <section class="section-card" id="glossary-list">
      <!-- JS will inject EVERYTHING here -->
    </section>

  </main>
</div>

<div id="rr-menu-panel" class="rr-menu-panel">
  <a href="index.html">Home</a>
  <a href="profile.html">Profile</a>
  <a href="works.html">Works</a>
  <a href="rights-and-registration.html">Rights</a>
  <a href="contracts.html">Contracts</a>
  <a href="documents.html">Documents</a>
  <a href="protection.html">Protection</a>
  <a href="glossary.html">Glossary</a>
</div>

<script src="assets/js/glossary-words.js"></script>
<script src="assets/js/glossary-music.js"></script>
<script src="assets/js/glossary-render.js"></script>

<script>
  document.getElementById("rr-menu-btn").addEventListener("click", () => {
    document.getElementById("rr-menu-panel").classList.toggle("show");
  });
</script>

</body>
</html>
