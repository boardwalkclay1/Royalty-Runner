<!DOCTYPE html>
<html lang="en" data-page="glossary">
<head>
  <meta charset="UTF-8" />
  <title>Royalty Runner – Glossary</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600&display=swap" rel="stylesheet">

  <style>
    body {
      background: url("assets/img/royal-glossary.jpg") no-repeat center center fixed;
      background-size: cover;
      background-color: #000;
    }

    .overlay {
      background: rgba(0, 0, 0, 0.82);
      min-height: 100vh;
      padding-bottom: 4rem;
    }

    .section-card {
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid var(--copper);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      backdrop-filter: blur(4px);
    }

    .glossary-tabs {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .glossary-tab {
      padding: 0.5rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--copper);
      background: rgba(0,0,0,0.7);
      color: var(--copper-light);
      cursor: pointer;
      font-family: 'Dancing Script', cursive;
      font-size: 1.3rem;
    }

    .glossary-tab.active {
      background: var(--copper);
      color: #000;
    }

    .glossary-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1rem;
      align-items: center;
    }

    .glossary-controls input,
    .glossary-controls select {
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      border: 1px solid var(--copper);
      background: #000;
      color: var(--copper-light);
    }

    .az-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem;
      margin-top: 0.75rem;
    }

    .az-btn {
      padding: 0.2rem 0.45rem;
      border-radius: 4px;
      border: 1px solid var(--copper);
      background: rgba(0,0,0,0.8);
      color: var(--copper-light);
      font-size: 0.8rem;
      cursor: pointer;
    }

    .az-btn.active {
      background: var(--copper);
      color: #000;
    }

    .glossary-item {
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 0.75rem 0;
    }

    .glossary-term-header {
      font-family: 'Dancing Script', cursive;
      font-size: 1.6rem;
      color: var(--copper);
      margin: 0 0 0.25rem 0;
    }

    .glossary-definition {
      margin: 0;
      color: #ddd;
      font-size: 0.95rem;
    }

    .glossary-meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 0.25rem;
    }

    .tag {
      display: inline-block;
      padding: 0.1rem 0.5rem;
      border-radius: 999px;
      border: 1px solid var(--copper);
      color: var(--copper-light);
      font-size: 0.7rem;
      margin-right: 0.25rem;
    }
  </style>
</head>

<body>
<div class="overlay">

  <header class="rr-header">
    <h1 class="cursive" style="font-size:3rem;">Royalty Runner Glossary</h1>
    <p class="tagline cursive" style="font-size:1.3rem;">Every term in the music world — decoded.</p>

    <button id="rr-menu-btn" class="rr-menu-btn">☰</button>

    <nav class="rr-nav cursive">
      <a href="index.html">Home</a>
      <a href="profile.html">Profile</a>
      <a href="manage.html">Manage</a>
      <a href="rights-and-registration.html">Rights</a>
      <a href="documents.html">Documents</a>
    </nav>
  </header>

  <main class="rr-main">

    <section class="section-card">
      <h2 class="cursive" style="font-size:2rem;">Choose Your Glossary</h2>

      <div class="glossary-tabs">
        <button class="glossary-tab active" data-tab="business">Business</button>
        <button class="glossary-tab" data-tab="creative">Creative</button>
        <button class="glossary-tab" data-tab="industry">Industry</button>
      </div>
    </section>

    <section class="section-card">
      <div class="glossary-controls">
        <input id="glossary-search" type="search" placeholder="Search terms or definitions..." />
        <select id="glossary-category">
          <option value="all">All Categories</option>
        </select>
        <button id="glossary-reset" class="az-btn">Reset</button>
      </div>

      <div id="glossary-az" class="az-bar"></div>
    </section>

    <section class="section-card">
      <h2 class="cursive" style="font-size:1.9rem;">Terms</h2>
      <div id="glossary-container"></div>
    </section>

  </main>
</div>

<!-- LOAD ALL THREE DB FILES -->
<script src="assets/js/glossary/glossary-business-db.js"></script>
<script src="assets/js/glossary/glossary-creative-db.js"></script>
<script src="assets/js/glossary/glossary-industry-db.js"></script>

<!-- MERGE THEM INTO ONE GLOSSARY -->
<script>
  window.GLOSSARY_DB = [
    ...BUSINESS_GLOSSARY_DB,
    ...CREATIVE_GLOSSARY_DB,
    ...INDUSTRY_GLOSSARY_DB
  ];
</script>

<!-- LOAD THE ENGINE -->
<script src="assets/js/glossary/glossary-utils.js"></script>
<script src="assets/js/glossary/glossary-render.js"></script>
<script src="assets/js/glossary/glossary-search.js"></script>

</body>
</html>
